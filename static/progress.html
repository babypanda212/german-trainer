<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortschritt</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="/trainer.css">
</head>
<body><div class="shell"><header class="topbar"><a class="brand" href="/"><span class="brandmark" aria-hidden="true">g.</span>German Trainer</a><nav aria-label="Hauptnavigation"><a href="/">Üben</a><a href="/progress.html" aria-current="page">Fortschritt</a></nav></header><main>
<div class="intro"><div><p class="eyebrow">Dein Lernweg</p><h1>Schritt für Schritt.</h1><p>Deine Gespräche, deine Wörter, dein Fortschritt.</p></div></div>
<div id="stats" class="muted stats" role="status"></div>
<div class="progress-grid"><div class="card"><h2 class="chart-title">Dein Niveau im Verlauf</h2><canvas id="level" aria-label="Geschätztes Niveau je Tag" role="img"></canvas></div>
<div class="card"><h2 class="chart-title">Daran arbeitest du</h2><canvas id="mistakes" aria-label="Korrekturen je Tag" role="img"></canvas></div>
<div class="card wide"><h2 class="chart-title">Deine bisherigen Gespräche</h2><div id="sessions"></div></div></div></main><footer class="footer"><span>Dein Deutsch. Dein Tempo.</span><span>Niveauschätzungen sind keine Prüfungsergebnisse.</span></footer></div>
<script>
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const TYPES = ["case","gender","verb_position","conjugation","word_order","preposition","article","vocab","other"];
const COLORS = ["#1a5fb4","#c62828","#2e7d32","#ef6c00","#6a1b9a","#00838f","#9e9d24","#5d4037","#616161"];
const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
fetch('/progress').then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(p => {
  const done = p.sessions.filter(s => s.ended_at && s.level_est);
  $('stats').textContent = `${done.length} Sitzungen · Vokabeln: ${p.vocab_total} (${p.vocab_due} fällig) · Zielwörter: ${Object.entries(p.target_counts).map(([k,v])=>k+' '+v).join(', ')}`;
  if (!done.length) { $('sessions').textContent = 'Hier erscheinen deine abgeschlossenen Gespräche. Starte deine erste Sitzung unter Üben.'; }
  if (typeof Chart === 'undefined') { $('stats').textContent += ' · Diagramme sind gerade nicht verfügbar.'; }
  // Aggregate by calendar day, not by individual session: several sessions on the same day
  // (a normal thing once you practice more than once daily) otherwise show as repeated,
  // hard-to-compare bars/points for that one day instead of one legible summary.
  const bySess = Object.fromEntries(p.mistakes_by_session.map(m => [m.session_id, m]));
  const days = [...new Set(done.map(s => s.started_at.slice(0,10)))].sort();
  const lvl = days.map(day => {
    const idx = done.filter(s => s.started_at.slice(0,10) === day).map(s => LEVELS.indexOf(s.level_est) + 1);
    return idx.reduce((a,b) => a+b, 0) / idx.length;
  });
  const ma = lvl.map((_, i) => { const w = lvl.slice(Math.max(0,i-4), i+1); return w.reduce((a,b)=>a+b,0)/w.length; });
  if (typeof Chart !== 'undefined') new Chart($('level'), { type:'line', data:{ labels: days, datasets:[
      {label:'Niveau (Ø des Tages)', data:lvl, borderColor:'#1a5fb4', pointRadius:4, tension:0},
      {label:'Ø 5 Tage', data:ma, borderColor:'#9e9d24', borderDash:[6,4], pointRadius:0}]},
    options:{ scales:{ y:{ min:1, max:6, ticks:{ callback:v => LEVELS[v-1] || '' } } } } });
  const mistakesByDay = days.map(day => {
    const sessionIds = done.filter(s => s.started_at.slice(0,10) === day).map(s => s.id);
    const totals = {};
    for (const sid of sessionIds) for (const t of TYPES) totals[t] = (totals[t]||0) + ((bySess[sid]||{})[t] || 0);
    return totals;
  });
  if (typeof Chart !== 'undefined') new Chart($('mistakes'), { type:'bar', data:{ labels: days, datasets: TYPES.map((t,i) => ({
      label:t, backgroundColor:COLORS[i], data: mistakesByDay.map(day => day[t] || 0) })) },
    options:{ scales:{ x:{stacked:true}, y:{stacked:true, title:{display:true, text:'Fehler'}} } } });
  if (done.length) $('sessions').innerHTML = done.slice().reverse().map(s =>
    `<details><summary>${s.started_at.slice(0,16).replace('T', ' · ')} · ${s.level_est}</summary><p>${escape(s.summary)}</p><div id="s${s.id}" class="muted">…</div></details>`).join('');
  document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', async () => {
    if (!d.open) return; const id = d.querySelector('div').id.slice(1);
    const x = await fetch('/session/'+id).then(r => r.json());
    d.querySelector('div').innerHTML = x.turns.map(t => `<pre><b>Du:</b> ${escape(t.user_de)}\n<b>Tutor:</b> ${escape(t.tutor_de)}</pre>`).join('');
  }, {once:true}));
}).catch(() => { $('stats').textContent = 'Der Fortschritt konnte nicht geladen werden. Bitte lade die Seite erneut.'; });
function $(id){ return document.getElementById(id); }
</script>
</body>
</html>
